    <!-- Omnitone (Google’s Ambisonic decoder) -->
    <script src="https://cdn.jsdelivr.net/npm/omnitone@latest/build/omnitone.min.js"></script>

    <script>
        AFRAME.registerComponent('hrtf-audio', {
        schema: { src: { type: 'asset' } },
        async init() {
            const scene = this.el.sceneEl;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();

            const decoder = Omnitone.createFOARenderer(ctx, {
                ambisonicOrder: 1,  // FOA = 1st order
                channelMap: [0, 1, 2, 3]
            });
            
            await decoder.initialize();

            const response = await fetch(this.data.src);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

            const source = ctx.createBufferSource();
            source.buffer = audioBuffer;
            source.loop = false;

            source.connect(decoder.input);
            decoder.output.connect(ctx.destination);

            scene.addEventListener('render-target-loaded', () => {
                const cam = scene.camera.el.object3D;
                scene.addEventListener('enter-vr', () => ctx.resume());
                scene.addEventListener('exit-vr', () => ctx.suspend());
                
                scene.addEventListener('beforexrselect', () => {
                    const rotMat = new THREE.Matrix4().extractRotation(cam.matrixWorld);
                    decoder.setRotationMatrixFromMatrix4(rotMat);
                });
            });

            this.el.addEventListener('play-hrtf', () => {
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                source.start(0);
            });
        }
    });

        </script>

        //Navigation Error System
        function check_dummy_wins(target_plane, dummy_plane, dummy_time) {
        return new Promise((resolve) => {
            let finished = false;

            function handleHover(buttonType) {
            if (!finished) {
                finished = true;
                if (buttonType === 'target') {
                resolve('Success'); 
                } 
                else {
                resolve('Fail'); 
                }
            }
            }

            target_plane.addEventListener('mouseenter', () => handleHover('target'), { once: true });
            dummy_plane.addEventListener('mouseenter', () => handleHover('dummy'), { once: true });

            setTimeout(() => {
            if (!finished) {
                finished = true;
                resolve('Failed to Look');
            }
            }, dummy_time);
        });
        }
        
        //Gaze Time System

        let startTime = null;

        function gaze_calculator_enter() {
            startTime = Date.now();
        }

        function gaze_calculator_exit(dataObj, property, textEl) {
            if (startTime) {
            const duration = Date.now() - startTime;
            dataObj[property] += duration;
            startTime = null;
            textEl.setAttribute('value', `Time: ${(dataObj[property] / 1000).toFixed(3)}s`);
            }
        }

        object_plane.addEventListener('mouseenter', () => {
            gaze_calculator_enter();
        });
        object_plane.addEventListener('mouseleave', () => {
            gaze_calculator_exit(gazeData.object1, 'time', object1_text);
        });


        //Reaction Time Calculator
        function check_reaction_time(spc_time, planeEl, callback) {
        let reaction_object = 0;
        let reacted = false;

        let reaction_watch = setInterval(() => {
            reaction_object++;
        }, 1000);

        planeEl.addEventListener('mouseenter', () => {
            if (!reacted) {
            reacted = true;
            clearInterval(reaction_watch);
            callback(reaction_object);
            }
        });

        setTimeout(() => {
            if (!reacted) {
            reacted = true;
            clearInterval(reaction_watch);
            callback('NULL');
            }
        }, spc_time);
        }

                console.error(`Element with id "${elementId}" not found.`);

                }

                clearInterval(timer);

                timer = setInterval(() => {
